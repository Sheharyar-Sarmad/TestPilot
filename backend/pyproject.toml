[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sheharyar-Sarmad", email = "developersheharyar2010@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "gitpython>=3.2.0",
    "httpx>=0.28.1",
    "langchain>=1.4.4",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.9",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.14",
    "mypy>=2.4.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "ruff>=0.17.0",
    "sqlalchemy>=2.1.4",
    "structlog>=26.1.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-language-pack>=1.21.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
